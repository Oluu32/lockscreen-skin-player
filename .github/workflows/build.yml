name: Build unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Archive without signing and package IPA
        run: |
          xcodebuild archive -project LockSkinPlayer.xcodeproj -scheme LockSkinPlayer -configuration Release -destination 'generic/platform=iOS' -archivePath build/LockSkinPlayer.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p build/Payload
          cp -R build/LockSkinPlayer.xcarchive/Products/Applications/LockSkinPlayer.app build/Payload/
          cd build && zip -qr LockSkinPlayer-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LockSkinPlayer-unsigned-IPA
          path: build/LockSkinPlayer-unsigned.ipa
          if-no-files-found: error
